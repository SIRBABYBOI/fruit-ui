name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency: publish-packages

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun run typecheck
      - run: bun test packages/zig-bridge
      - run: bun run build
      - name: Require alpha package versions
        run: |
          node -e 'for (const name of ["core", "react", "zig-bridge"]) { const version = require(`./packages/${name}/package.json`).version; if (!/-alpha(?:\.|$)/.test(version)) { console.error(`${name} is not an alpha version: ${version}`); process.exitCode = 1; } }'
      - uses: changesets/action/publish@v2
        with:
          script: bunx changeset publish --tag alpha
          create-github-releases: false
