name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun run typecheck
      - run: bun test packages/zig-bridge
      - run: bun test packages/react/src/workspace
      - run: bun test packages/react/tests
      - run: bun run build
